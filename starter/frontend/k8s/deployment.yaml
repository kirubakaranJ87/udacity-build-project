apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 401523952255.dkr.ecr.us-east-1.amazonaws.com/mp-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_MOVIE_API_URL
              value: "http://ac48c9f551a2f4e4f9b3a887f110d79e-1146320562.us-east-1.elb.amazonaws.com"